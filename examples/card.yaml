# Template of the TV guide card for the Polish guide https://epg.ovh/pl.gz.
#
# How to use it:
# 1. Change `number` to the channel numbers of your box. Delete the channels you do not have.
# 2. In Home Assistant, open the TV guide integration options and tick the same channels.
#    The `epg_id` values below are the ids from that list.
# 3. Edit a dashboard, add a card, choose "Manual" and paste this file.
#
# A channel not ticked in the integration shows "Not selected in the integration".
# To add a channel that is not here, tick it in the integration and copy its id: the list shows
# "Name (id: ...)" when the id is not the same as the name.

type: custom:tv-guide
switch_action:
  # Your own action that switches the box. {number} becomes the channel number.
  perform_action: script.cable_box_go_to_channel
  data:
    channel: "{number}"
sections:
  - title: Main
    channels:
      - { number: 1, name: TVP 1, epg_id: TVP 1 }
      - { number: 2, name: TVP 2, epg_id: TVP 2 }
      - { number: 3, name: Polsat, epg_id: Polsat }
      - { number: 4, name: TVN, epg_id: TVN }
      - { number: 5, name: TV 4, epg_id: TV 4 }
      - { number: 6, name: TV Puls, epg_id: TV Puls }
      - { number: 7, name: TVN 7, epg_id: TVN 7 }
      - { number: 8, name: TVP 3, epg_id: TVP 3 }
      - { number: 9, name: TV 6, epg_id: TV 6 }
