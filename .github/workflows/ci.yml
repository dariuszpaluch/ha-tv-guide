name: CI

on:
  push:
  pull_request:
  # The release workflow runs these jobs first.
  workflow_call:

permissions:
  contents: read

# A new push to the same branch cancels the older run. The group name starts with `ci-`, so the
# release workflow, which runs this and validate.yml at the same time, never cancels its own checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv reads .python-version and installs that Python: the one Home Assistant runs on.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run pytest --cov=custom_components/tv_guide --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
