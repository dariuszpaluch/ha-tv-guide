name: Validate

on:
  push:
  pull_request:
  # HACS and hassfest rules change with new releases, so check once a week also without a push.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  workflow_call:

# A private repository needs read access for the checkout.
permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # The HACS action fails on a private repository. Skip it until the repository is public.
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - if: steps.visibility.outputs.private == 'true'
        run: echo "::notice::HACS validates only public repositories. The check is skipped."
      - if: steps.visibility.outputs.private == 'false'
        uses: hacs/action@main
        with:
          category: integration
