name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # The release is already published when this runs. A failed check stops the zip upload,
  # so HACS cannot install a broken build.
  test:
    uses: ./.github/workflows/ci.yml

  validate:
    uses: ./.github/workflows/validate.yml

  zip:
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the card
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # The card URL carries the manifest version. A new release must change it, or browsers keep the old card.
      - name: Write the release tag into manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - "${TAG#v}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("custom_components/tv_guide/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      # HACS unpacks the zip into custom_components/tv_guide/, so manifest.json must sit at the zip root.
      - name: Zip the integration
        run: cd custom_components/tv_guide && zip -r ../../tv_guide.zip . -x '__pycache__/*'
      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tv_guide.zip --clobber
