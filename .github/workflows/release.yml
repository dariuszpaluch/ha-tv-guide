name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the card
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # HACS unpacks the zip into custom_components/tv_guide/, so manifest.json must sit at the zip root.
      - name: Zip the integration
        run: cd custom_components/tv_guide && zip -r ../../tv_guide.zip . -x '__pycache__/*'
      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tv_guide.zip --clobber
