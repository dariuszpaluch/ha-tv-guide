[project]
name = "ha-tv-guide"
version = "0.0.0"
description = "TV guide for Home Assistant: integration and Lovelace card"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "home-assistant-frontend==20260930.4",
  "pytest-homeassistant-custom-component==0.13.373",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.report]
# The tests cover 99% now. The check fails when a change adds much untested code.
fail_under = 95
